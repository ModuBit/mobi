name: CI

on:
  push:
    branches: [main, fist-milestone]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # warning budget：P2 收窄后清零（any 97 全收窄 + control-regex 4 抑制），零容忍防回潮
      - run: bun run lint --max-warnings 0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # 循环依赖硬卡：P3 已清零（hub/sync 5 + cli/claude 7），no-circular severity=error，回潮即 CI 失败
      - run: bun run lint:deps
