# Ir 基线下调（棘轮的「只降不升」半边，模拟 claude.ai 性能冲刺的日任务压上限）
# 手动触发：优化落地后运行，Ir 改进时自动下调基线并提交；无改进则空转。
# 周调度兜底：捡拾 PR 里打印了 notice 但没人手动下调的收益。
# 基线缺失（首次）时直接创建。
name: bench-baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 测量环境（node pin/valgrind/依赖/测量）收口在 composite action，与 ci.yml bench-ratchet 共用
      - uses: ./.github/actions/ir-measure
        id: ir
      - name: 基线缺失则创建；有改进则下调并提交
        run: |
          FILE=packages/cli/benchmarks/ir-baseline.txt
          NEW=${{ steps.ir.outputs.ir }}
          OLD=$(cat "$FILE" 2>/dev/null || echo "")
          if [ -n "$OLD" ] && [ "$NEW" -ge "$OLD" ]; then
            echo "Ir=$NEW，基线=${OLD:-无}，无改进，不更新"
            exit 0
          fi
          echo "$NEW" > "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if [ -n "$OLD" ]; then
            git commit -m "chore(bench): Ir 基线下调 $OLD → $NEW"
          else
            git commit -m "chore(bench): 建立 Ir 基线 $NEW"
          fi
          git push
