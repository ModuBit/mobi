<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- viewport-fit=cover：内容延伸到刘海/圆角/home 指示条区域，让 env(safe-area-inset-*)
         返回真实避让值（否则 iOS 下恒为 0，safe-area 全失效）。各贴边组件用 env() 自行避让。
         maximum-scale 维持禁用缩放（看代码靠 drawer 内横向滚动，避免输入误捏合放大） -->
    <!-- 浏览器 chrome（标签栏/地址栏）着色：静态默认浅色 #ffffff / 深色 #141414，运行时由 MainLayout 按 uiStore.theme 动态覆盖 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <!-- 早读 mobi-ui theme，React 加载前同步设 theme-color，消除刷新时"先黑后浅"闪烁。
         mobi 主题独立于系统主题（system 才跟随），media query 兜底仅用于 localStorage 无值的首次访问 -->
    <script>
        (function () {
            try {
                var raw = JSON.parse(localStorage.getItem('mobi-ui') || '{}')
                var theme = (raw.state && raw.state.theme) || 'dark'
                var resolved = theme === 'system'
                    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : theme
                var color = resolved === 'dark' ? '#141414' : '#ffffff'
                document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
                    m.setAttribute('content', color)
                })
            } catch (e) { /* localStorage 不可用等异常，静默回退 media 默认 */ }
        })()
    </script>
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon.ico" sizes="32x32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mobi" />
    <link rel="apple-touch-icon" href="/brand/icon.png" />
    <title>Mobi</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
