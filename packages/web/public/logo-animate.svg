<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 128 128"
>

    <style>

        svg{
            overflow:visible;
        }

        .logo{
            transform-origin:center;
            animation:
                float 2800ms ease-in-out infinite;
            animation-delay:1500ms;
        }

        .layer1{
            opacity:0;
            animation:
                build1 800ms cubic-bezier(.22,1,.36,1) forwards;
        }

        .layer2{
            opacity:0;
            animation:
                build2 800ms cubic-bezier(.22,1,.36,1) forwards;
            animation-delay:250ms;
        }

        .layer3{
            opacity:0;
            animation:
                build3 800ms cubic-bezier(.22,1,.36,1) forwards;
            animation-delay:500ms;
        }

        .dot{
            opacity:0;

            animation:
                dotAppear 500ms ease forwards,
                pulse 2800ms ease-in-out infinite;

            animation-delay:
                900ms,
                1500ms;
        }

        .scan{

            stroke-dasharray:8 54;
            stroke-dashoffset:0;

            animation:
                scan 2400ms linear infinite;

            animation-delay:1500ms;
        }

        @keyframes build1{

            from{
                opacity:0;
                transform:
                    translateY(20px)
                    scaleY(.6);
            }

            to{
                opacity:1;
                transform:
                    translateY(0)
                    scaleY(1);
            }
        }

        @keyframes build2{

            from{
                opacity:0;
                transform:
                    translateY(20px)
                    scaleY(.6);
            }

            to{
                opacity:.16;
                transform:
                    translateY(0)
                    scaleY(1);
            }
        }

        @keyframes build3{

            from{
                opacity:0;
                transform:
                    translateY(20px)
                    scaleY(.6);
            }

            to{
                opacity:.08;
                transform:
                    translateY(0)
                    scaleY(1);
            }
        }

        @keyframes dotAppear{

            from{
                opacity:0;
                transform:scale(.6);
            }

            to{
                opacity:1;
                transform:scale(1);
            }
        }

        @keyframes pulse{

            0%{
                transform:scale(1);
            }

            20%{
                transform:scale(1.15);
            }

            40%{
                transform:scale(1);
            }

            100%{
                transform:scale(1);
            }
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            25%{
                transform:translateY(-3px);
            }

            50%{
                transform:translateY(0px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        @keyframes scan{

            from{
                stroke-dashoffset:0;
            }

            to{
                stroke-dashoffset:-62;
            }
        }

    </style>

    <g class="logo" fill="currentColor">

        <!-- Layer 3 -->

        <rect
            class="layer3"
            x="57"
            y="17"
            width="29"
            height="78"
            rx="15"
            opacity=".08"
        />

        <!-- Layer 2 -->

        <rect
            class="layer2"
            x="50"
            y="11"
            width="29"
            height="78"
            rx="15"
            opacity=".16"
        />

        <!-- Layer 1 -->

        <rect
            class="layer1"
            x="43"
            y="5"
            width="29"
            height="78"
            rx="15"
        />

        <!-- Hollow Dot -->

        <g transform="translate(57.5 114)">
            <g class="dot">

                <circle
                    r="9"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3.5"
                />

                <circle
                    class="scan"
                    r="9"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3.5"
                    stroke-linecap="round"
                    opacity=".5"
                />

            </g>
        </g>

    </g>

</svg>
