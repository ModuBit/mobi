# hindsight 单容器自部署
# 官方 full 镜像 = API(:8888) + Control Plane UI(:9999) + 内嵌 pg0 Postgres
# 数据持久化在 ~/.hindsight/data（bind mount，宿主真实目录，Time Machine 可备份；
# 不放仓库内——运行时数据与代码分离，重克隆/搬移仓库不牵连数据）
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    # 官方推荐：本地 embeddings/reranker 依赖 torch 线程共享内存
    shm_size: "1g"
    ports:
      - "8888:8888" # API（mobi memory settings 的 endpoint 指这里）
      - "9999:9999" # Control Plane UI（mobi 记忆设置页「打开控制台」预期端口）
    # Docker Desktop 偶发 VM 内嵌 DNS 无上游（resolv.conf 显示 NO EXTERNAL NAMESERVERS），
    # 容器内所有域名解析失败；显式指定公共 DNS 绕过（治本是重启 Docker Desktop）
    dns:
      - 223.5.5.5 # 阿里公共 DNS
      - 119.29.29.29 # 腾讯公共 DNS
    env_file: .env
    environment:
      # 稳定 worker id：多副本/重建容器时保持同一身份
      HINDSIGHT_API_WORKER_ID: hindsight-selfhost
      # 国内网络：embedding/reranker 模型下载走 hf-mirror
      HF_ENDPOINT: https://hf-mirror.com
      # document-transfer import API 默认关闭，hindsight.sh 的 import/reembed 依赖它
      HINDSIGHT_API_ENABLE_DOCUMENT_IMPORT_API: "true"
      # 首启要从 hf-mirror 下载本地 embedding/reranker 模型（数百 MB），默认初始化上限太短
      # 会导致下载被取消 → start-all.sh 健康等待(默认300s)杀容器 → 无限重启；
      # start-all.sh 的等待会跟随此值(+30s 余量)，改这一个即可
      HINDSIGHT_API_MODEL_INIT_TIMEOUT: "3600"
    volumes:
      - ${HOME}/.hindsight/data:/home/hindsight/.pg0 # 内嵌 Postgres 数据目录（容器内 UID 1000 属主；macOS Docker Desktop 的 VirtioFS 自动映射，无需手工 chown）
      - ${HOME}/.hindsight/hf:/home/hindsight/.cache/huggingface # 模型缓存持久化：首启下载中断/重建容器不用从头下载
